<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCU Registrasi Klinik</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --text-color: #ffffff;
            --primary-color: #ff4b4b;
            --green: #92D050;
            --yellow: #F4F207;
            --red: #FF0000;
            --blue: #1E88E5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 480px; }
        h2, h3 { margin: 8px 0; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            background-color: #2b2b2b;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button { background-color: var(--primary-color); font-weight: bold; cursor: pointer; border: none; }
        button.secondary { background-color: #444; }
        .stat-box {
            display: flex; justify-content: space-around;
            background: #1a1a1a; border: 1px solid var(--border-color);
            border-radius: 6px; padding: 8px; margin-bottom: 10px; font-size: 0.85rem;
        }
        .participant-item {
            border: 1px solid #444; border-radius: 6px; margin-bottom: 6px;
            padding: 10px 12px; cursor: pointer; display: flex; align-items: center;
            justify-content: space-between; font-weight: bold; font-size: 0.9rem;
        }
        .card-red { background-color: var(--red) !important; color: #fff !important; }
        .card-yellow { background-color: var(--yellow) !important; color: #000 !important; }
        .card-green { background-color: var(--green) !important; color: #000 !important; }
        .card-white { background-color: #e0e0e0 !important; color: #000 !important; }

        .details-box {
            display: none; background: #1a1a1a; color: #fff; padding: 10px;
            border-radius: 6px; margin-top: -3px; margin-bottom: 8px; font-size: 0.85rem;
            border: 1px solid var(--border-color); border-left: 3px solid var(--primary-color);
        }
        .details-box.active { display: block; }
        .radio-group { display: flex; gap: 15px; margin: 8px 0; font-size: 0.85rem; color: #fff; }
        .hidden { display: none !important; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row button { flex: 1; }
        .btn-edit { background-color: var(--blue) !important; color: #fff; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 900; overflow-y: auto;
            display: flex; justify-content: center; align-items: flex-start; padding: 10px; box-sizing: border-box;
        }
        .modal-box { width: 100%; max-width: 480px; margin-top: 20px; }
        .modal-box label { font-size: 0.85rem; color: #ccc; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; font-size: 1.1rem; z-index: 999;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay hidden">
    <div style="font-size: 2rem; margin-bottom: 10px;">⏳</div>
    <div id="loadingText">Memproses Server...</div>
</div>

<!-- FORM EDIT PESERTA -->
<div id="editModal" class="modal-overlay hidden">
    <div class="card modal-box">
        <h3>✏️ Edit Peserta <small id="editNoInfo" style="font-weight:normal;color:#888;"></small></h3>
        <label>Nama</label>
        <input type="text" id="editNama">
        <label>NIK</label>
        <input type="text" id="editNik" inputmode="numeric">
        <label>No HP</label>
        <input type="tel" id="editHp">
        <label>Tempat Lahir</label>
        <input type="text" id="editTempat">
        <label>Tanggal Lahir</label>
        <input type="date" id="editTgl" onchange="hitungUsiaEdit()">
        <label>Usia (otomatis dari tanggal lahir)</label>
        <input type="text" id="editUsia" readonly style="background:#1a1a1a;color:#aaa;">
        <label>Kehadiran</label>
        <select id="editStatus">
            <option value="HADIR">Hadir</option>
            <option value="BELUM">Tidak hadir</option>
        </select>
        <div id="editHaidWrap">
            <label>Haid / Hamil</label>
            <select id="editHaid" onchange="onEditHaidChange()">
                <option value="">Tidak ada</option>
                <option value="HAID">HAID</option>
                <option value="HAMIL">HAMIL</option>
            </select>
            <select id="editHaidHari" class="hidden">
                <option value="1">Hari Ke-1</option><option value="2">Hari Ke-2</option><option value="3">Hari Ke-3</option>
                <option value="4">Hari Ke-4</option><option value="5">Hari Ke-5</option><option value="6">Hari Ke-6</option><option value="7">Hari Ke-7</option><option value="Lainnya">Lainnya</option>
            </select>
            <input type="text" id="editHaidTxt" class="hidden" placeholder="Ketik hari keberapa...">
        </div>
        <div class="btn-row">
            <button class="secondary" onclick="closeEdit()">Batal</button>
            <button onclick="saveEdit()" style="background:var(--green); color:#000;">💾 Simpan</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="mcuInstallPanel" class="card hidden">
        <button id="mcuInstallButton" type="button" style="margin:0; background:var(--blue); color:#fff;">&#128242; Instal Aplikasi MCU</button>
    </div>
    <!-- HALAMAN LOGIN -->
    <div id="loginSection" class="card">
        <h3>🏥 MCU Registrasi <small style="font-weight:normal;color:#888;">v4</small></h3>
        <label>URL Apps Script (Web App)</label>
        <input type="text" id="inputUrl" value="https://script.google.com/macros/s/AKfycbxvKfpvDrlunxxrDcV2VvOKBFzDxDprL8mFvsucx0PgM6-lnSRDE5TRKSjOemSG85HwNw/exec">
        <label>PIN Akses</label>
        <input type="password" id="inputPin" placeholder="Masukkan PIN...">
        <button onclick="handleLogin()">Masuk</button>
    </div>

    <!-- HALAMAN UTAMA / BERANDA -->
    <div id="homeSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>🏥 MCU Registrasi</h3>
            <button class="secondary" style="width: auto; padding: 6px 12px;" onclick="handleLogout()">Keluar</button>
        </div>
        
        <div class="card">
            <h3>Mulai Kegiatan</h3>
            <label>Pilih PT</label>
            <select id="selectPt"></select>
            <label>Tanggal</label>
            <input type="date" id="inputTgl">
            <label>Upload File Mentah Excel (.xlsx)</label>
            <input type="file" id="inputExcel" accept=".xlsx, .xls" onchange="siapkanFile()">
            <div id="fileStatus" style="font-size:0.8rem; margin:4px 0 8px 0;"></div>
            <button onclick="previewExcel()">Periksa File Excel</button>
            <button class="secondary" onclick="mulaiManual()" style="margin-top:8px;">✍️ Mulai Tanpa File (Input Manual)</button>
        </div>

        <!-- PREVIEW & KONFIRMASI DUPLIKAT -->
        <div id="previewSection" class="card hidden" style="border: 2px solid var(--yellow);">
            <h4 style="color:var(--yellow); margin-top:0;">📊 Hasil Pemeriksaan File</h4>
            <div id="previewInfo" style="margin-bottom: 8px;"></div>
            
            <div id="conflictContainer" class="hidden" style="background:#251a00; padding:10px; border-radius:6px; margin-bottom:10px;">
                <p style="margin:0 0 5px 0; font-weight:bold; color:var(--yellow);">⚠️ Ditemukan Data Peserta Ganda (Double):</p>
                <div id="conflictList" style="font-size:0.8rem; max-height:120px; overflow-y:auto; margin-bottom:8px;"></div>
                
                <label style="font-size:0.85rem;">Pilih Tindakan untuk Data Double:</label>
                <select id="conflictAction">
                    <option value="skip">Lewati Data Double (Gunakan yang pertama)</option>
                    <option value="overwrite">Timpa dengan Data Terbaru (Gunakan yang terakhir)</option>
                    <option value="force_add">Tetap Tambahkan Semua (Biarkan Double)</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <button id="btnSimpanUpload" onclick="saveUpload()">Simpan Peserta</button>
                <button class="secondary" onclick="cancelUpload()">Batal</button>
            </div>
        </div>

        <div class="card">
            <h3>Daftar Kegiatan</h3>
            <div id="kegiatanList">Belum ada kegiatan.</div>
        </div>
        
        <div class="card" style="border-color: #555;">
            <button class="secondary" onclick="resetAllData()">🗑️ Reset Semua Data</button>
        </div>
    </div>

    <!-- HALAMAN DETAIL KEGIATAN & PRESENSI -->
    <div id="detailSection" class="hidden">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
            <button class="secondary" style="width: auto; margin:0;" onclick="backToHome()">⬅️ Kembali</button>
            <h4 id="detailTitle" style="margin:0;"></h4>
        </div>

        <input type="text" id="searchBox" placeholder="🔍 Ketik nama atau no TTD..." oninput="filterParticipants()">

        <div class="stat-box">
            <div>Peserta: <span id="statTotal" style="font-weight:bold;">0</span></div>
            <div style="color:var(--yellow);">Hadir: <span id="statHadir" style="font-weight:bold;">0</span></div>
            <div style="color:var(--green);">Berkas: <span id="statKumpul" style="font-weight:bold;">0</span></div>
        </div>

        <!-- FORM TAMBAH PESERTA MANUAL -->
        <div class="card" style="background:#181818; border-color:#444;">
            <details>
                <summary style="cursor:pointer; font-weight:bold; color:var(--text-color);">➕ Tambah Peserta Manual</summary>
                <div style="margin-top:10px;">
                    <label>Nama Lengkap</label>
                    <input type="text" id="mNama" placeholder="Nama peserta...">
                    <label>NIK (16 Digit)</label>
                    <input type="text" id="mNik" placeholder="Nomor KTP/NIK...">
                    <label>No HP</label>
                    <input type="tel" id="mHp" placeholder="Nomor HP...">
                    <label>Tempat Lahir</label>
                    <input type="text" id="mTempat" placeholder="Kota/kabupaten tempat lahir...">
                    <label>Tanggal Lahir</label>
                    <input type="date" id="mTgl">
                    <label>Jenis Kelamin</label>
                    <select id="mJk"><option value="L">Laki-laki (L)</option><option value="P">Perempuan (P)</option></select>
                    <button onclick="addManualParticipant()">Simpan Peserta Manual</button>
                </div>
            </details>
        </div>

        <div id="participantList"></div>

        <!-- TOMBOL EXPORT EXCEL 4 SHEET DENGAN STYLING BLOK WARNA & BORDER PENUH -->
        <button onclick="exportToExcel4Sheets()" style="background:var(--blue); color:#fff; margin-top: 10px; margin-bottom: 10px;">📥 Unduh File Excel Final (4 Sheet)</button>

        <!-- MODAL PILIH BEDA SAAT TUTUP MCU -->
        <div id="conflictBox" class="card hidden" style="border: 2px solid var(--yellow); margin-top:10px;">
            <h4 style="color:var(--yellow); margin-top:0;">⚠️ Perbedaan Data Ditemukan</h4>
            <p id="conflictText" style="font-size:0.85rem;"></p>
            <div style="display: flex; gap: 10px;">
                <button onclick="resolveClose('AWAL')">Sesuai Data Awal</button>
                <button class="secondary" onclick="resolveClose('OLAHAN')">Sesuai Data Olahan</button>
            </div>
        </div>

        <div style="margin-top: 15px;" id="actionButtonsContainer">
            <button id="btnCloseMcu" onclick="closeMcu()">🔒 Close MCU</button>
            <button class="secondary" onclick="resetCurrentKegiatan()">⚠️ Reset Data MCU Ini</button>
        </div>

        <div id="closedInfoSection" class="hidden card" style="background:#151515;">
            <p id="closedDriveLinks"></p>
            <button id="btnOpenAgain" onclick="openAgainMcu()">🔓 Buka lagi untuk diedit</button>
        </div>
    </div>
</div>

<!-- SheetJS & SheetJS-Style untuk Border, Alignment, dan Background Warna Sel Penuh -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
    let appData = {
        url: localStorage.getItem("mcu_url") || "https://script.google.com/macros/s/AKfycbxvKfpvDrlunxxrDcV2VvOKBFzDxDprL8mFvsucx0PgM6-lnSRDE5TRKSjOemSG85HwNw/exec",
        pin: localStorage.getItem("mcu_pin") || "",
        home: null,
        activeKegiatan: null,
        tempUploadPayload: null
    };

    function setTanggalHariIni() {
        let d = new Date();
        let iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        let el = document.getElementById("inputTgl");
        if (el && !el.value) el.value = iso;
    }

    window.onload = function() {
        setTanggalHariIni();
        if (appData.pin) {
            document.getElementById("inputPin").value = appData.pin;
            document.getElementById("inputUrl").value = appData.url;
            handleLogin(true);
        }
    };

    function showLoading(show, text = "Memproses Server...") {
        let el = document.getElementById("loading");
        document.getElementById("loadingText").textContent = text;
        el.classList.toggle("hidden", !show);
    }

    async function callBackend(fn, args = [], senyap = false) {
        showLoading(true, "Menghubungkan ke Server...");
        try {
            let res = await fetch(appData.url, {
                method: "POST",
                body: JSON.stringify({ pin: appData.pin, fn: fn, args: args })
            });
            let json = await res.json();
            showLoading(false);
            if (!json.ok) throw new Error(json.error || "Kesalahan server");
            return json.data;
        } catch (err) {
            showLoading(false);
            if (!senyap) alert("Error: " + err.message);
            throw err;
        }
    }

    async function handleLogin(isAuto = false) {
        if (!isAuto) {
            appData.url = document.getElementById("inputUrl").value.trim();
            appData.pin = document.getElementById("inputPin").value.trim();
        }
        if (!appData.pin) {
            if (!isAuto) alert("Masukkan PIN terlebih dahulu!");
            return;
        }
        try {
            let home = await callBackend("getHome");
            appData.home = home;
            localStorage.setItem("mcu_pin", appData.pin);
            localStorage.setItem("mcu_url", appData.url);

            let sel = document.getElementById("selectPt");
            sel.innerHTML = "";
            (home.pt || []).forEach(p => {
                let opt = document.createElement("option");
                opt.value = p.kode;
                opt.textContent = p.kode;
                sel.appendChild(opt);
            });

            renderKegiatanList(home.keg || []);

            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("homeSection").classList.remove("hidden");
        } catch (e) {
            if (isAuto) handleLogout();
        }
    }

    function handleLogout() {
        localStorage.removeItem("mcu_pin");
        appData.pin = "";
        appData.activeKegiatan = null;
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("homeSection").classList.add("hidden");
        document.getElementById("detailSection").classList.add("hidden");
    }

    function renderKegiatanList(kegs) {
        let div = document.getElementById("kegiatanList");
        if (!kegs.length) {
            div.innerHTML = "Belum ada kegiatan.";
            return;
        }
        div.innerHTML = "";
        kegs.forEach(g => {
            let statusLbl = g.status === "DRAFT" ? "Draft" : "Ditutup";
            let box = document.createElement("div");
            box.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#252525; padding:8px; border-radius:6px; margin-bottom:5px;";
            box.innerHTML = `<span><b>${g.kode}</b> · ${g.tgl}</span> <button style="width:auto; padding:4px 10px;" onclick="openKegiatan('${g.id}')">Buka (${statusLbl})</button>`;
            div.appendChild(box);
        });
    }

    async function openKegiatan(id) {
        let keg = await callBackend("getKegiatan", [id]);
        appData.activeKegiatan = keg;
        renderDetailKegiatan();
        document.getElementById("homeSection").classList.add("hidden");
        document.getElementById("detailSection").classList.remove("hidden");
    }

    function backToHome() {
        appData.activeKegiatan = null;
        document.getElementById("detailSection").classList.add("hidden");
        document.getElementById("homeSection").classList.remove("hidden");
        handleLogin(true);
    }

    // Membaca file Excel dari input. Kalau hasilnya kosong (sering terjadi di HP saat file
    // baru dipilih dari WhatsApp/Drive), file dibaca ulang otomatis oleh previewExcel.
    // Membaca isi file dengan 3 cara bergantian (file dari WA sering kosong di cara pertama)
    async function bacaIsiFile(file, diag) {
        const nama = ["A", "B", "C"];
        const cara = [
            () => file.arrayBuffer ? file.arrayBuffer() : Promise.reject(new Error("tidak ada")),
            () => new Promise((ok, gagal) => {
                let r = new FileReader();
                r.onload = e => ok(e.target.result);
                r.onerror = () => gagal(r.error || new Error("gagal"));
                r.readAsArrayBuffer(file);
            }),
            async () => {
                let u = URL.createObjectURL(file);
                try { return await (await fetch(u)).arrayBuffer(); } finally { URL.revokeObjectURL(u); }
            }
        ];
        let terbaik = null, i = -1;
        for (const c of cara) {
            i++;
            try {
                let buf = await c();
                let n = buf ? buf.byteLength : 0;
                if (diag) diag.push(`${nama[i]}:${n}B`);
                if (!n) continue;
                if (!file.size || n === file.size) return buf; // utuh
                if (!terbaik || n > terbaik.byteLength) terbaik = buf;
            } catch (e) {
                if (diag) diag.push(`${nama[i]}:ERR ${(e && e.name) || ""}`);
            }
        }
        return terbaik;
    }

    function pesanFile(e, file) {
        let m = String((e && e.message) || "");
        let kb = file ? Math.round(file.size / 1024) : 0;
        let r = e && e.rincian ? ` [${e.rincian}]` : "";
        if (file && file.size === 0) return "File kosong (0 KB), kemungkinan file dari WA belum selesai diunduh.";
        if (m === "FILE_RUSAK") return "File bukan Excel yang valid atau diberi password." + r;
        return `Isi file belum terbaca (ukuran file ${kb} KB).` + r;
    }

    // Memperbaiki sheet yang rentang selnya (!ref) hilang atau salah, supaya baris tidak terbaca kosong
    function perbaikiRef(ws) {
        let r = null;
        Object.keys(ws).forEach(k => {
            if (k[0] === "!") return;
            let c = XLSX.utils.decode_cell(k);
            if (!r) r = { s: { r: c.r, c: c.c }, e: { r: c.r, c: c.c } };
            else {
                if (c.r < r.s.r) r.s.r = c.r; if (c.c < r.s.c) r.s.c = c.c;
                if (c.r > r.e.r) r.e.r = c.r; if (c.c > r.e.c) r.e.c = c.c;
            }
        });
        if (r) ws["!ref"] = XLSX.utils.encode_range(r);
    }

    async function bacaFileExcel(file) {
        let skipRegex = /^(PENDAFTARAN|HADIR|TIDAK HADIR|MCU KLINIK JEPARA|DATA MENTAH|MAILINGS)$/i;
        let diag = [];
        let buf = await bacaIsiFile(file, diag);
        if (!buf) { let e = new Error("FILE_KOSONG"); e.rincian = diag.join(", "); throw e; }
        let workbook;
        try { workbook = XLSX.read(new Uint8Array(buf), { type: 'array' }); }
        catch (x) {
            let e = new Error(buf.byteLength === file.size ? "FILE_RUSAK" : "FILE_KOSONG");
            e.rincian = diag.join(", ") + "; " + ((x && x.message) || x);
            throw e;
        }
        const kumpul = pakaiSkip => {
            let payloadSheets = [], rawSheets = [], totalBaris = 0;
            workbook.SheetNames.forEach(sheetName => {
                if (pakaiSkip && skipRegex.test(sheetName)) return;
                let ws = workbook.Sheets[sheetName];
                perbaikiRef(ws);
                let rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                totalBaris += rows.length;
                rawSheets.push({ name: sheetName, rows: rows });
                payloadSheets.push({ name: sheetName, rows: rows.map(r => r.slice(0, 40)) });
            });
            return { payloadSheets, rawSheets, totalBaris };
        };
        let hasil = kumpul(true);
        if (hasil.totalBaris === 0) hasil = kumpul(false); // semua sheet bernama "dilewati" -> pakai semuanya
        if (hasil.totalBaris === 0) {
            let e = new Error("FILE_KOSONG");
            e.rincian = diag.join(", ") + "; sheet: " + workbook.SheetNames.join(" | ");
            throw e;
        }
        return { payloadSheets: hasil.payloadSheets, rawSheets: hasil.rawSheets };
    }

    function bolehUlang(msg) {
        return /FILE_KOSONG|fetch|network|Load failed|JSON|Unexpected|timeout/i.test(msg || "");
    }

    function kunciFile(f) { return f.name + "|" + f.size + "|" + f.lastModified; }

    // Isi file dibaca & diurai SEGERA setelah dipilih, supaya tidak gagal karena file
    // sudah "hilang" dari browser saat tombol Periksa ditekan.
    async function siapkanFile() {
        let st = document.getElementById("fileStatus");
        let input = document.getElementById("inputExcel");
        let f = input.files[0];
        appData.fileCache = null;
        if (!f) { st.textContent = ""; return; }
        let key = kunciFile(f), lastErr = null;
        const jeda = [0, 1500, 3000, 6000];
        for (let t = 0; t < jeda.length; t++) {
            st.style.color = "#aaa";
            st.textContent = t === 0 ? "⏳ Membaca file..." : `⏳ Membaca… coba ke-${t + 1}`;
            if (jeda[t]) await new Promise(r => setTimeout(r, jeda[t]));
            let f2 = input.files[0];
            if (!f2 || kunciFile(f2) !== key) return; // file sudah diganti, hentikan
            try {
                let data = await bacaFileExcel(f2);
                appData.fileCache = { key: key, data: data };
                let n = data.payloadSheets.reduce((m, x) => m + x.rows.length, 0);
                st.style.color = "var(--green)"; st.textContent = `✅ File siap dibaca (${n} baris)`;
                return;
            } catch (e) {
                lastErr = e;
                if (e.message === "FILE_RUSAK") break;
            }
        }
        st.style.color = "var(--red, #ff6b6b)";
        st.textContent = "❌ " + pesanFile(lastErr, f) + " ";
        let bt = document.createElement("button");
        bt.textContent = "📂 Pilih ulang file";
        bt.className = "secondary";
        bt.style.cssText = "width:auto; padding:6px 12px; margin:6px 0 0 0;";
        bt.onclick = () => { input.value = ""; input.click(); };
        st.appendChild(document.createElement("br"));
        st.appendChild(bt);
    }

    async function previewExcel() {
        let pt = document.getElementById("selectPt").value;
        let tgl = document.getElementById("inputTgl").value;
        let fileInput = document.getElementById("inputExcel");
        if (!fileInput.files.length || !tgl) {
            alert("Pilih file Excel dan Tanggal terlebih dahulu!");
            return;
        }

        showLoading(true, "Membaca file Excel...");
        let file = fileInput.files[0];
        try {
            let data = (appData.fileCache && appData.fileCache.key === kunciFile(file)) ? appData.fileCache.data : null;
            let res = null, lastErr = null;
            for (let t = 0; t < 3; t++) {
                try {
                    if (t > 0) {
                        showLoading(true, `Mencoba lagi (${t}/2)...`);
                        await new Promise(r => setTimeout(r, 1200));
                    }
                    if (!data) {
                        data = await bacaFileExcel(file);
                        appData.fileCache = { key: kunciFile(file), data: data };
                    }
                    res = await callBackend("previewUpload", [pt, tgl, data.payloadSheets], true);
                    break;
                } catch (e) {
                    lastErr = e;
                    if (!bolehUlang(e.message)) break;
                }
            }
            if (!res) throw lastErr || new Error("Gagal membaca file.");
            appData.tempUploadPayload = { kode: pt, tgl: tgl, payload: data.payloadSheets, raw: data.rawSheets };

            document.getElementById("previewInfo").innerHTML = `<b>Total Ditemukan: ${res.total} Peserta</b> | Baru: ${res.baru}, Dilewati: ${res.lewat}` +
                (res.catatan ? `<div style="color:var(--yellow); margin-top:6px; font-size:0.85rem;">⚠️ ${res.catatan}</div>` : "");

            let conflictBox = document.getElementById("conflictContainer");
            let conflictList = document.getElementById("conflictList");
            conflictList.innerHTML = "";
            if (res.cek && res.cek.length > 0) {
                conflictBox.classList.remove("hidden");
                res.cek.forEach(c => {
                    conflictList.innerHTML += `• No ${c.no}. <b>${c.nama}</b>: ${c.masalah}<br>`;
                });
            } else {
                conflictBox.classList.add("hidden");
            }
            document.getElementById("previewSection").classList.remove("hidden");
        } catch (err) {
            showLoading(false);
            let m = String(err.message || "");
            alert("Gagal membaca file Excel: " + ((m === "FILE_KOSONG" || m === "FILE_RUSAK") ? pesanFile(err, file) : m));
        }
    }

    // Format keterangan haid: "HAID+3" -> "H+3", "HAID" -> "HAID", "HAMIL" -> "HAMIL"
    function fmtHaid(v) {
        if (!v) return "";
        v = String(v).trim().toUpperCase();
        let m = v.match(/^HAID\s*\+\s*(.+)$/);
        if (m) return "H+" + m[1].trim();
        return v;
    }

    // Format tanggal: SMJ = BLN-TGL-THN (sesuai contoh), PWJ = THN-BLN-TGL
    function fmtTglOut(t, isSMJ) {
        let m = String(t || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return t || "";
        return isSMJ ? `${m[2]}-${m[3]}-${m[1]}` : `${m[1]}-${m[2]}-${m[3]}`;
    }

    function downloadBuffer(buf, name) {
        let blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }

    // EXPORT EXCEL 4 SHEET (ExcelJS)
    // KUNING = hadir, IJO = form terkumpul, MERAH = tidak hadir
    // NO selalu nomor dari data pendaftaran. Sheet pertama = file mentah.
    async function exportToExcel4Sheets() {
        let K = appData.activeKegiatan;
        if (!K || !K.rows) return;

        let kodePt = String(K.kode || "").toUpperCase();
        let isSMJ = kodePt.includes("SMJ");
        let headers = isSMJ
            ? ['NO', 'NO RM', 'NAMA', 'JK', 'TANGGAL LAHIR (BLN-TGL-THN)', 'USIA', 'NO KTP', 'NO HP', 'JENIS MCU', 'TTD', 'HAID/HAMIL']
            : ['NO', 'NO RM', 'NAMA', 'NO. URUT MCU', 'BAGIAN', 'JABATAN', 'TEMPAT LAHIR', 'TANGGAL LAHIR', 'USIA', 'JENIS KELAMIN', 'NO HP', 'NO. KTP', 'TTD', 'HAID/HAMIL'];
        let nCols = headers.length;
        let namaCol = 3; // kolom NAMA (1-based)
        let judul = isSMJ ? "DAFTAR HADIR MEDICAL CHECK UP PT SAMI JEPARA FACTORY" : "DAFTAR HADIR MEDICAL CHECK UP PT PARKLAND WORLD INDONESIA";
        let colWidths = isSMJ
            ? [5.75, 17.63, 28.88, 7, 15.13, 7, 18.88, 15.13, 13.88, 10.13, 13.88]
            : [5.75, 17.63, 28.88, 12.63, 16.38, 10, 15.13, 11, 7, 13.88, 15.13, 18.88, 10.13, 13.88];

        let thin = { style: "thin", color: { argb: "FF000000" } };
        let border = { top: thin, bottom: thin, left: thin, right: thin };
        let fillOf = hex => ({ type: "pattern", pattern: "solid", fgColor: { argb: "FF" + hex } });

        function rowValues(p) {
            let jkFull = String(p.jk || "").toUpperCase();
            if (isSMJ) {
                return [p.no, p.rm, p.nama, jkFull, fmtTglOut(p.tgl, true), p.usia, p.nik, p.hp, p.jenis, p.no, fmtHaid(p.haid)];
            }
            let urut = p.urut;
            if (!urut) {
                let m = String(K.tgl || "").match(/(\d{4})-(\d{2})-(\d{2})/);
                if (m) urut = `${m[3]}${m[2]}${m[1]}-${String(p.no).padStart(3, "0")}`;
            }
            jkFull = jkFull === "P" ? "PEREMPUAN" : (jkFull === "L" ? "LAKI-LAKI" : jkFull);
            return [p.no, p.rm, p.nama, urut, p.bagian, p.jabatan, p.tempat, fmtTglOut(p.tgl, false), p.usia, jkFull, p.hp, p.nik, p.no, fmtHaid(p.haid)];
        }

        function warna(p, sheetName) {
            if (sheetName === "TIDAK HADIR") return "FF0000";
            if (p.kumpul) return "92D050";
            if (p.hadir) return "FFFF00";
            return "FF0000";
        }

        let wb = new ExcelJS.Workbook();

        // ---- Sheet 1: file mentah apa adanya ----
        let rawStored = null;
        try { rawStored = JSON.parse(localStorage.getItem("mcu_raw_" + K.id)); } catch (e) {}
        // Tidak ada salinan mentah di perangkat ini -> minta izin menyusun dari data yang sudah tersimpan di server
        if (!(rawStored && rawStored.length)) {
            if (confirm("File mentah tidak ada di perangkat ini (kemungkinan di-upload dari perangkat lain).\n\nSusun sheet file mentah dari data yang sudah tersimpan di server?")) {
                try {
                    let m = await callBackend("getMentah", [K.id]);
                    if (m && m.header && m.rows && m.rows.length) {
                        rawStored = [{ name: "MCU KLINIK JEPARA", rows: [m.header].concat(m.rows) }];
                        try { localStorage.setItem("mcu_raw_" + K.id, JSON.stringify(rawStored)); } catch (e) {}
                    } else {
                        alert("Tidak ada data mentah tersimpan di server untuk kegiatan ini. Sheet file mentah dilewati.");
                    }
                } catch (e) {
                    alert("Data mentah tidak bisa diambil dari server (pastikan Code.gs sudah diperbarui). Sheet file mentah dilewati.");
                }
            }
        }
        if (rawStored && rawStored.length) {
            rawStored.forEach((sh, i) => {
                let ws = wb.addWorksheet(i === 0 ? "MCU KLINIK JEPARA" : sh.name);
                let maxC = 0, lastRow = 0;
                sh.rows.forEach((r, ri) => {
                    r.forEach((v, c) => { if (v !== "" && v != null) { maxC = Math.max(maxC, c + 1); lastRow = Math.max(lastRow, ri + 1); } });
                });
                let wd = Array(maxC).fill(6);
                for (let ri = 0; ri < lastRow; ri++) {
                    let r = sh.rows[ri] || [];
                    let row = ws.getRow(ri + 1);
                    for (let c = 0; c < maxC; c++) {
                        let v = r[c];
                        let has = !(v === undefined || v === null || v === "");
                        let cell = row.getCell(c + 1);
                        cell.value = has ? String(v) : null;
                        cell.border = border;
                        if (ri === 0) {
                            cell.font = { name: "Calibri", size: 11, bold: true };
                            cell.fill = fillOf("D9D9D9");
                        } else {
                            cell.font = { name: "Calibri", size: 11 };
                        }
                        if (has) wd[c] = Math.min(40, Math.max(wd[c], String(v).split("\n").reduce((m, x) => Math.max(m, x.length), 0) + 2));
                    }
                }
                wd.forEach((w, c) => { ws.getColumn(c + 1).width = w; });
            });
        }

        // ---- Sheet 2-4 ----
        function buildSheet(sheetName, subsetRows) {
            let ws = wb.addWorksheet(sheetName);
            ws.getCell(1, 1).value = judul;
            let BLN_ID = ["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
            let tm = String(K.tgl || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
            ws.getCell(2, 1).value = tm ? `TANGGAL ${parseInt(tm[3])} ${BLN_ID[parseInt(tm[2]) - 1]} ${tm[1]}` : `TANGGAL ${K.tgl}`;
            ws.mergeCells(1, 1, 1, nCols);
            ws.mergeCells(2, 1, 2, nCols);
            [1, 2].forEach(r => {
                ws.getCell(r, 1).font = { name: "Calibri", size: 11, bold: true };
            });
            colWidths.forEach((w, i) => { ws.getColumn(i + 1).width = w; });

            headers.forEach((h, i) => {
                let cell = ws.getCell(4, i + 1);
                cell.value = h;
                cell.font = { name: "Calibri", size: 11, bold: true };
                cell.fill = fillOf("D9D9D9");
                cell.border = border;
            });

            subsetRows.forEach((p, ri) => {
                let vals = rowValues(p);
                let hex = warna(p, sheetName);
                for (let c = 0; c < nCols; c++) {
                    let cell = ws.getCell(5 + ri, c + 1);
                    let v = vals[c];
                    cell.value = (v === undefined || v === null) ? "" : String(v);
                    cell.font = { name: "Calibri", size: 11 };
                    cell.fill = fillOf(hex);
                    cell.border = border;
                }
            });
        }

        buildSheet("PENDAFTARAN", K.rows);
        buildSheet("HADIR", K.rows.filter(p => p.hadir));
        buildSheet("TIDAK HADIR", K.rows.filter(p => !p.hadir));

        let buf = await wb.xlsx.writeBuffer();
        downloadBuffer(buf, `MCU_${K.kode}_${K.tgl}.xlsx`);
    }

    // LIVE SEARCH INSTAN DENGAN FULL BLOK WARNA BACKGROUND CARD
    function filterParticipants() {
        let K = appData.activeKegiatan;
        if (!K) return;
        let q = document.getElementById("searchBox").value.trim().toUpperCase();
        let listDiv = document.getElementById("participantList");
        listDiv.innerHTML = "";

        K.rows.forEach(p => {
            let match = !q || p.no.toString() === q || p.nama.toUpperCase().includes(q);
            if (!match) return;

            let cardColorClass = "card-white";
            if (K.status === "DITUTUP" && !p.hadir) {
                cardColorClass = "card-red";
            } else if (p.kumpul) {
                cardColorClass = "card-green";
            } else if (p.hadir) {
                cardColorClass = "card-yellow";
            }

            let item = document.createElement("div");
            item.className = `participant-item ${cardColorClass}`;
            item.innerHTML = `<span>${p.no}. ${p.nama}</span> <span>▼</span>`;
            item.onclick = () => {
                let box = item.nextElementSibling;
                box.classList.toggle("active");
            };

            let details = document.createElement("div");
            details.className = "details-box";
            
            let htmlDetails = `<b>RM:</b> ${p.rm} | <b>NIK:</b> ${p.nik || '-'}<br>` +
                              `<b>Tgl Lahir:</b> ${p.tgl} | <b>Usia:</b> ${p.usia || '-'}thn | <b>JK:</b> ${p.jk}<br>`;
            if (p.haid) htmlDetails += `<span style="color:var(--yellow);"><b>Ket:</b> ${fmtHaid(p.haid)}</span><br>`;
            
            let editBtn = `<button class="btn-edit" onclick="openEdit(${p.no})">✏️ Edit</button>`;
            if (K.status === "DRAFT") {
                if (!p.hadir) {
                    let isP = String(p.jk).toUpperCase().includes("P");
                    htmlDetails += `<hr style="border-color:#444; margin:5px 0;">`;
                    if (isP) {
                        htmlDetails += `<div class="radio-group">` +
                                       `<label><input type="radio" name="stat_${p.no}" value="" checked onclick="onRadioChange(${p.no}, '')"> Tidak ada</label>` +
                                       `<label><input type="radio" name="stat_${p.no}" value="HAID" onclick="onRadioChange(${p.no}, 'HAID')"> HAID</label>` +
                                       `<label><input type="radio" name="stat_${p.no}" value="HAMIL" onclick="onRadioChange(${p.no}, 'HAMIL')"> HAMIL</label>` +
                                       `</div>` +
                                       `<select id="haid_sel_${p.no}" style="display:none;" onchange="onSelectHaidChange(${p.no})">` +
                                       `<option value="1">Hari Ke-1</option><option value="2">Hari Ke-2</option><option value="3">Hari Ke-3</option>` +
                                       `<option value="4">Hari Ke-4</option><option value="5">Hari Ke-5</option><option value="6">Hari Ke-6</option><option value="7">Hari Ke-7</option><option value="Lainnya">Lainnya</option>` +
                                       `</select>` +
                                       `<input type="text" id="haid_txt_${p.no}" class="hidden" placeholder="Ketik hari keberapa...">`;
                    }
                    htmlDetails += `<div class="btn-row"><button onclick="setHadir(${p.no})">✅ Set Hadir</button>${editBtn}</div>`;
                } else if (p.hadir && !p.kumpul) {
                    htmlDetails += `<hr style="border-color:#444; margin:5px 0;"><div class="btn-row"><button onclick="setKumpul(${p.no})" style="background:var(--green); color:#000;">📁 Berkas Terkumpul</button>${editBtn}</div>`;
                }
            }
            if (K.status === "DRAFT" && p.kumpul) htmlDetails += `<hr style="border-color:#444; margin:5px 0;"><div class="btn-row">${editBtn}</div>`;
            details.innerHTML = htmlDetails;

            listDiv.appendChild(item);
            listDiv.appendChild(details);
        });
    }

    function onRadioChange(no, val) {
        let sel = document.getElementById(`haid_sel_${no}`);
        let txt = document.getElementById(`haid_txt_${no}`);
        if (!sel) return;
        if (val === "HAID") {
            sel.style.display = "block";
            onSelectHaidChange(no);
        } else {
            sel.style.display = "none";
            if (txt) txt.classList.add("hidden");
        }
    }

    function onSelectHaidChange(no) {
        let sel = document.getElementById(`haid_sel_${no}`);
        let txt = document.getElementById(`haid_txt_${no}`);
        if (!sel || !txt) return;
        if (sel.value === "Lainnya") {
            txt.classList.remove("hidden");
        } else {
            txt.classList.add("hidden");
        }
    }

    async function setHadir(no) {
        let K = appData.activeKegiatan;
        let p = K.rows.find(x => x.no === no);
        let val = "";
        let isP = String(p.jk).toUpperCase().includes("P");
        if (isP) {
            let radios = document.getElementsByName(`stat_${no}`);
            let chosen = "";
            for (let r of radios) { if (r.checked) chosen = r.value; }
            if (chosen === "HAID") {
                let sel = document.getElementById(`haid_sel_${no}`).value;
                if (sel === "Lainnya") {
                    let customVal = document.getElementById(`haid_txt_${no}`).value.trim();
                    val = customVal ? `HAID+${customVal}` : "HAID";
                } else {
                    val = `HAID+${sel}`;
                }
            } else if (chosen === "HAMIL") {
                val = "HAMIL";
            }
        }
        let res = await callBackend("setHadir", [K.id, no, val]);
        Object.assign(p, res);
        renderDetailKegiatan();
    }

    // ===== EDIT PESERTA =====
    let editNoAktif = null;

    function hitungUsia(tgl) {
        if (!tgl) return "";
        let a = tgl.split("-").map(Number), n = new Date();
        let u = n.getFullYear() - a[0];
        if (n.getMonth() + 1 < a[1] || (n.getMonth() + 1 === a[1] && n.getDate() < a[2])) u--;
        return isNaN(u) ? "" : u;
    }

    function hitungUsiaEdit() {
        document.getElementById("editUsia").value = hitungUsia(document.getElementById("editTgl").value);
    }

    function onEditHaidChange() {
        let st = document.getElementById("editHaid").value;
        let hari = document.getElementById("editHaidHari");
        let txt = document.getElementById("editHaidTxt");
        hari.classList.toggle("hidden", st !== "HAID");
        txt.classList.toggle("hidden", !(st === "HAID" && hari.value === "Lainnya"));
        hari.onchange = onEditHaidChange;
    }

    function openEdit(no) {
        let K = appData.activeKegiatan;
        let p = K.rows.find(x => x.no === no);
        if (!p) return;
        editNoAktif = no;
        document.getElementById("editNoInfo").textContent = `(No. ${p.no})`;
        document.getElementById("editNama").value = p.nama || "";
        document.getElementById("editNik").value = p.nik || "";
        document.getElementById("editHp").value = p.hp || "";
        document.getElementById("editTempat").value = p.tempat || "";
        document.getElementById("editTgl").value = p.tgl || "";
        hitungUsiaEdit();
        document.getElementById("editStatus").value = p.hadir ? "HADIR" : "BELUM";

        let isP = String(p.jk).toUpperCase().includes("P");
        document.getElementById("editHaidWrap").classList.toggle("hidden", !isP);

        // isi haid/hamil dari data yang ada
        let selHaid = document.getElementById("editHaid");
        let selHari = document.getElementById("editHaidHari");
        let txt = document.getElementById("editHaidTxt");
        Array.from(selHaid.querySelectorAll("option[data-lama]")).forEach(o => o.remove());
        selHaid.value = ""; selHari.value = "1"; txt.value = "";
        let raw = String(p.haid || "").trim();
        let up = raw.toUpperCase();
        let m = up.match(/^HAID\s*\+\s*(.+)$/);
        if (m) {
            selHaid.value = "HAID";
            let h = m[1].trim();
            if (["1","2","3","4","5","6","7"].includes(h)) { selHari.value = h; }
            else { selHari.value = "Lainnya"; txt.value = h; }
        } else if (up === "HAID") {
            selHaid.value = "HAID"; selHari.value = "Lainnya"; txt.value = "";
        } else if (up === "HAMIL") {
            selHaid.value = "HAMIL";
        } else if (raw) {
            let o = document.createElement("option");
            o.value = "LAMA"; o.textContent = "Tetap: " + raw; o.setAttribute("data-lama", "1");
            selHaid.appendChild(o);
            selHaid.value = "LAMA";
        }
        onEditHaidChange();
        document.getElementById("editModal").classList.remove("hidden");
    }

    function closeEdit() {
        document.getElementById("editModal").classList.add("hidden");
        editNoAktif = null;
    }

    async function saveEdit() {
        let K = appData.activeKegiatan;
        let p = K.rows.find(x => x.no === editNoAktif);
        if (!p) return;
        let nama = document.getElementById("editNama").value.trim();
        if (!nama) { alert("Nama wajib diisi."); return; }

        let hadirBaru = document.getElementById("editStatus").value === "HADIR";
        if (!hadirBaru && p.kumpul) {
            if (!confirm("Peserta ini sudah tercatat berkas terkumpul. Kalau diubah ke Tidak hadir, catatan terkumpul juga ikut terhapus. Lanjut?")) return;
        }
        let status = !hadirBaru ? "BELUM" : (p.kumpul ? "KUMPUL" : "HADIR");

        let isP = String(p.jk).toUpperCase().includes("P");
        let haid = "";
        if (isP) {
            let st = document.getElementById("editHaid").value;
            if (st === "HAID") {
                let hari = document.getElementById("editHaidHari").value;
                if (hari === "Lainnya") {
                    let c = document.getElementById("editHaidTxt").value.trim();
                    haid = c ? `HAID+${c}` : "HAID";
                } else {
                    haid = `HAID+${hari}`;
                }
            } else if (st === "HAMIL") {
                haid = "HAMIL";
            } else if (st === "LAMA") {
                haid = p.haid || "";
            }
        }

        let d = {
            nama: nama,
            jk: (p.jk === "L" || p.jk === "P") ? p.jk : "",
            tgl: document.getElementById("editTgl").value,
            nik: document.getElementById("editNik").value.replace(/\D/g, ""),
            hp: document.getElementById("editHp").value.trim(), jenis: p.jenis, urut: p.urut, bagian: p.bagian,
            jabatan: p.jabatan, tempat: document.getElementById("editTempat").value.trim(),
            haid: haid, status: status
        };
        let res = await callBackend("simpanPeserta", [K.id, Number(p.no), d]);
        Object.assign(p, res);
        closeEdit();
        renderDetailKegiatan();
    }

    async function setKumpul(no) {
        let K = appData.activeKegiatan;
        let p = K.rows.find(x => x.no === no);
        let res = await callBackend("setKumpul", [K.id, Number(no)]);
        Object.assign(p, res);
        renderDetailKegiatan();
    }

    async function closeMcu() {
        let K = appData.activeKegiatan;
        let res = await callBackend("tutup", [K.id]);
        if (res && res.perlu) {
            document.getElementById("conflictText").textContent = `Ada ${res.jumlah} perbedaan data olahan dengan file pendaftaran awal.`;
            document.getElementById("conflictBox").classList.remove("hidden");
        } else {
            appData.activeKegiatan = res;
            renderDetailKegiatan();
            alert("MCU berhasil ditutup!");
        }
    }

    async function resolveClose(pilihan) {
        let K = appData.activeKegiatan;
        let res = await callBackend("tutup", [K.id, pilihan]);
        appData.activeKegiatan = res;
        renderDetailKegiatan();
    }

    async function openAgainMcu() {
        let K = appData.activeKegiatan;
        let res = await callBackend("bukaLagi", [K.id]);
        appData.activeKegiatan = res;
        renderDetailKegiatan();
        alert("MCU berhasil dibuka kembali!");
    }

    async function resetCurrentKegiatan() {
        if (!confirm("Yakin ingin menghapus data MCU ini?")) return;
        let K = appData.activeKegiatan;
        await callBackend("resetKegiatan", [K.id]);
        backToHome();
    }

    async function resetAllData() {
        if (!confirm("Yakin ingin mereset SELURUH data?")) return;
        await callBackend("resetSemua");
        handleLogin(true);
    }
</script>
<script>
(function () {
    let installPrompt = null;
    const panel = document.getElementById('mcuInstallPanel');
    const button = document.getElementById('mcuInstallButton');
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    window.addEventListener('beforeinstallprompt', function (event) {
        if (standalone) return;
        event.preventDefault();
        installPrompt = event;
        panel.classList.remove('hidden');
    });
    button.addEventListener('click', async function () {
        if (!installPrompt) return;
        const prompt = installPrompt;
        installPrompt = null;
        panel.classList.add('hidden');
        try { await prompt.prompt(); } catch (error) { console.warn('MCU install prompt:', error); }
    });
    window.addEventListener('appinstalled', function () {
        installPrompt = null;
        panel.classList.add('hidden');
    });
})();
</script>
