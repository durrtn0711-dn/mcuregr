<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCU Registrasi Klinik</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --text-color: #ffffff;
            --primary-color: #ff4b4b;
            --green: #92D050;
            --yellow: #F4F207;
            --red: #FF0000;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 480px; }
        h2, h3 { margin: 8px 0; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            background-color: #2b2b2b;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button { background-color: var(--primary-color); font-weight: bold; cursor: pointer; border: none; }
        button.secondary { background-color: #444; }
        .stat-box {
            display: flex; justify-content: space-around;
            background: #1a1a1a; border: 1px solid var(--border-color);
            border-radius: 6px; padding: 8px; margin-bottom: 10px; font-size: 0.85rem;
        }
        .participant-item {
            border: 1px solid #444; border-radius: 6px; margin-bottom: 6px;
            padding: 10px 12px; cursor: pointer; display: flex; align-items: center;
            justify-content: space-between; font-weight: bold; font-size: 0.9rem;
        }
        .card-red { background-color: var(--red) !important; color: #fff !important; }
        .card-yellow { background-color: var(--yellow) !important; color: #000 !important; }
        .card-green { background-color: var(--green) !important; color: #000 !important; }
        .card-white { background-color: #e0e0e0 !important; color: #000 !important; }

        .details-box {
            display: none; background: #1a1a1a; color: #fff; padding: 10px;
            border-radius: 6px; margin-top: -3px; margin-bottom: 8px; font-size: 0.85rem;
            border: 1px solid var(--border-color); border-left: 3px solid var(--primary-color);
        }
        .details-box.active { display: block; }
        .radio-group { display: flex; gap: 15px; margin: 8px 0; font-size: 0.85rem; color: #fff; }
        .hidden { display: none !important; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; font-size: 1.1rem; z-index: 999;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay hidden">
    <div style="font-size: 2rem; margin-bottom: 10px;">⏳</div>
    <div id="loadingText">Memproses Server...</div>
</div>

<div class="container">
    <!-- HALAMAN LOGIN -->
    <div id="loginSection" class="card">
        <h3>🏥 MCU Registrasi</h3>
        <label>URL Apps Script (Web App)</label>
        <input type="text" id="inputUrl" value="https://script.google.com/macros/s/AKfycbxvKfpvDrlunxxrDcV2VvOKBFzDxDprL8mFvsucx0PgM6-lnSRDE5TRKSjOemSG85HwNw/exec">
        <label>PIN Akses</label>
        <input type="password" id="inputPin" placeholder="Masukkan PIN...">
        <button onclick="handleLogin()">Masuk</button>
    </div>

    <!-- HALAMAN UTAMA / BERANDA -->
    <div id="homeSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>🏥 MCU Registrasi</h3>
            <button class="secondary" style="width: auto; padding: 6px 12px;" onclick="handleLogout()">Keluar</button>
        </div>
        
        <div class="card">
            <h3>Mulai Kegiatan</h3>
            <label>Pilih PT</label>
            <select id="selectPt"></select>
            <label>Tanggal</label>
            <input type="date" id="inputTgl">
            <label>Upload File Mentah Excel (.xlsx)</label>
            <input type="file" id="inputExcel" accept=".xlsx, .xls">
            <button onclick="previewExcel()">Periksa File Excel (Kilat)</button>
        </div>

        <!-- PREVIEW & KONFIRMASI DUPLIKAT -->
        <div id="previewSection" class="card hidden" style="border: 2px solid var(--yellow);">
            <h4 style="color:var(--yellow); margin-top:0;">📊 Hasil Pemeriksaan File</h4>
            <div id="previewInfo" style="margin-bottom: 8px;"></div>
            
            <div id="conflictContainer" class="hidden" style="background:#251a00; padding:10px; border-radius:6px; margin-bottom:10px;">
                <p style="margin:0 0 5px 0; font-weight:bold; color:var(--yellow);">⚠️ Ditemukan Data Peserta Ganda (Double):</p>
                <div id="conflictList" style="font-size:0.8rem; max-height:120px; overflow-y:auto; margin-bottom:8px;"></div>
                
                <label style="font-size:0.85rem;">Pilih Tindakan untuk Data Double:</label>
                <select id="conflictAction">
                    <option value="skip">Lewati Data Double (Gunakan yang pertama)</option>
                    <option value="overwrite">Timpa dengan Data Terbaru (Gunakan yang terakhir)</option>
                    <option value="force_add">Tetap Tambahkan Semua (Biarkan Double)</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <button id="btnSimpanUpload" onclick="saveUpload()">Simpan Peserta</button>
                <button class="secondary" onclick="cancelUpload()">Batal</button>
            </div>
        </div>

        <div class="card">
            <h3>Daftar Kegiatan</h3>
            <div id="kegiatanList">Belum ada kegiatan.</div>
        </div>
        
        <div class="card" style="border-color: #555;">
            <button class="secondary" onclick="resetAllData()">🗑️ Reset Semua Data</button>
        </div>
    </div>

    <!-- HALAMAN DETAIL KEGIATAN & PRESENSI -->
    <div id="detailSection" class="hidden">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
            <button class="secondary" style="width: auto; margin:0;" onclick="backToHome()">⬅️ Kembali</button>
            <h4 id="detailTitle" style="margin:0;"></h4>
        </div>

        <input type="text" id="searchBox" placeholder="🔍 Ketik nama, RM, NIK instan..." oninput="filterParticipants()">

        <div class="stat-box">
            <div>Peserta: <span id="statTotal" style="font-weight:bold;">0</span></div>
            <div style="color:var(--yellow);">Hadir: <span id="statHadir" style="font-weight:bold;">0</span></div>
            <div style="color:var(--green);">Berkas: <span id="statKumpul" style="font-weight:bold;">0</span></div>
        </div>

        <!-- FORM TAMBAH PESERTA MANUAL -->
        <div class="card" style="background:#181818; border-color:#444;">
            <details>
                <summary style="cursor:pointer; font-weight:bold; color:var(--text-color);">➕ Tambah Peserta Manual</summary>
                <div style="margin-top:10px;">
                    <label>Nama Lengkap</label>
                    <input type="text" id="mNama" placeholder="Nama peserta...">
                    <label>No RM</label>
                    <input type="text" id="mRm" placeholder="Nomor RM...">
                    <label>NIK (16 Digit)</label>
                    <input type="text" id="mNik" placeholder="Nomor KTP/NIK...">
                    <label>Tanggal Lahir</label>
                    <input type="date" id="mTgl">
                    <label>Jenis Kelamin</label>
                    <select id="mJk"><option value="L">Laki-laki (L)</option><option value="P">Perempuan (P)</option></select>
                    <button onclick="addManualParticipant()">Simpan Peserta Manual</button>
                </div>
            </details>
        </div>

        <div id="participantList"></div>

        <!-- TOMBOL EXPORT EXCEL 4 SHEET (PERSIS FORMAT PYTHON) -->
        <button onclick="exportToExcel4Sheets()" style="background:var(--green); color:#000; margin-top: 10px; margin-bottom: 10px;">📥 Unduh File Excel Final (4 Sheet)</button>

        <!-- MODAL PILIH BEDA SAAT TUTUP MCU -->
        <div id="conflictBox" class="card hidden" style="border: 2px solid var(--yellow); margin-top:10px;">
            <h4 style="color:var(--yellow); margin-top:0;">⚠️ Perbedaan Data Ditemukan</h4>
            <p id="conflictText" style="font-size:0.85rem;"></p>
            <div style="display: flex; gap: 10px;">
                <button onclick="resolveClose('AWAL')">Sesuai Data Awal</button>
                <button class="secondary" onclick="resolveClose('OLAHAN')">Sesuai Data Olahan</button>
            </div>
        </div>

        <div style="margin-top: 15px;" id="actionButtonsContainer">
            <button id="btnCloseMcu" onclick="closeMcu()">🔒 Close MCU</button>
            <button class="secondary" onclick="resetCurrentKegiatan()">⚠️ Reset Data MCU Ini</button>
        </div>

        <div id="closedInfoSection" class="hidden card" style="background:#151515;">
            <p id="closedDriveLinks"></p>
            <button id="btnOpenAgain" onclick="openAgainMcu()">🔓 Buka lagi untuk diedit</button>
        </div>
    </div>
</div>

<!-- SheetJS & SheetJS Style Plugin untuk Border, Alignment, dan Background Color Penuh -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx-js-style.min.js"></script>
<script>
    let appData = {
        url: localStorage.getItem("mcu_url") || "https://script.google.com/macros/s/AKfycbxvKfpvDrlunxxrDcV2VvOKBFzDxDprL8mFvsucx0PgM6-lnSRDE5TRKSjOemSG85HwNw/exec",
        pin: localStorage.getItem("mcu_pin") || "",
        home: null,
        activeKegiatan: null,
        tempUploadPayload: null
    };

    window.onload = function() {
        if (appData.pin) {
            document.getElementById("inputPin").value = appData.pin;
            document.getElementById("inputUrl").value = appData.url;
            handleLogin(true);
        }
    };

    function showLoading(show, text = "Memproses Server...") {
        let el = document.getElementById("loading");
        document.getElementById("loadingText").textContent = text;
        el.classList.toggle("hidden", !show);
    }

    async function callBackend(fn, args = []) {
        showLoading(true, "Menghubungkan ke Server...");
        try {
            let res = await fetch(appData.url, {
                method: "POST",
                body: JSON.stringify({ pin: appData.pin, fn: fn, args: args })
            });
            let json = await res.json();
            showLoading(false);
            if (!json.ok) throw new Error(json.error || "Kesalahan server");
            return json.data;
        } catch (err) {
            showLoading(false);
            alert("Error: " + err.message);
            throw err;
        }
    }

    async function handleLogin(isAuto = false) {
        if (!isAuto) {
            appData.url = document.getElementById("inputUrl").value.trim();
            appData.pin = document.getElementById("inputPin").value.trim();
        }
        if (!appData.pin) {
            if (!isAuto) alert("Masukkan PIN terlebih dahulu!");
            return;
        }
        try {
            let home = await callBackend("getHome");
            appData.home = home;
            localStorage.setItem("mcu_pin", appData.pin);
            localStorage.setItem("mcu_url", appData.url);

            let sel = document.getElementById("selectPt");
            sel.innerHTML = "";
            (home.pt || []).forEach(p => {
                let opt = document.createElement("option");
                opt.value = p.kode;
                opt.textContent = p.kode;
                sel.appendChild(opt);
            });

            renderKegiatanList(home.keg || []);

            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("homeSection").classList.remove("hidden");
        } catch (e) {
            if (isAuto) handleLogout();
        }
    }

    function handleLogout() {
        localStorage.removeItem("mcu_pin");
        appData.pin = "";
        appData.activeKegiatan = null;
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("homeSection").classList.add("hidden");
        document.getElementById("detailSection").classList.add("hidden");
    }

    function renderKegiatanList(kegs) {
        let div = document.getElementById("kegiatanList");
        if (!kegs.length) {
            div.innerHTML = "Belum ada kegiatan.";
            return;
        }
        div.innerHTML = "";
        kegs.forEach(g => {
            let statusLbl = g.status === "DRAFT" ? "Draft" : "Ditutup";
            let box = document.createElement("div");
            box.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#252525; padding:8px; border-radius:6px; margin-bottom:5px;";
            box.innerHTML = `<span><b>${g.kode}</b> · ${g.tgl}</span> <button style="width:auto; padding:4px 10px;" onclick="openKegiatan('${g.id}')">Buka (${statusLbl})</button>`;
            div.appendChild(box);
        });
    }

    async function openKegiatan(id) {
        let keg = await callBackend("getKegiatan", [id]);
        appData.activeKegiatan = keg;
        renderDetailKegiatan();
        document.getElementById("homeSection").classList.add("hidden");
        document.getElementById("detailSection").classList.remove("hidden");
    }

    function backToHome() {
        appData.activeKegiatan = null;
        document.getElementById("detailSection").classList.add("hidden");
        document.getElementById("homeSection").classList.remove("hidden");
        handleLogin(true);
    }

    async function previewExcel() {
        let pt = document.getElementById("selectPt").value;
        let tgl = document.getElementById("inputTgl").value;
        let fileInput = document.getElementById("inputExcel");
        if (!fileInput.files.length || !tgl) {
            alert("Pilih file Excel dan Tanggal terlebih dahulu!");
            return;
        }

        showLoading(true, "Membaca file Excel secepat kilat...");
        let file = fileInput.files[0];
        let reader = new FileReader();
        
        reader.onload = async function(e) {
            try {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, { type: 'array' });
                let payloadSheets = [];
                let skipRegex = /^(PENDAFTARAN|HADIR|TIDAK HADIR|MCU KLINIK JEPARA|DATA MENTAH|MAILINGS)$/i;

                workbook.SheetNames.forEach(sheetName => {
                    if (!skipRegex.test(sheetName)) {
                        let ws = workbook.Sheets[sheetName];
                        let rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                        let trimmedRows = rows.map(r => r.slice(0, 40));
                        payloadSheets.push({ name: sheetName, rows: trimmedRows });
                    }
                });

                let res = await callBackend("previewUpload", [pt, tgl, payloadSheets]);
                appData.tempUploadPayload = { kode: pt, tgl: tgl, payload: payloadSheets };

                document.getElementById("previewInfo").innerHTML = `<b>Total Ditemukan: ${res.total} Peserta</b> | Baru: ${res.baru}, Dilewati: ${res.lewat}`;
                
                let conflictBox = document.getElementById("conflictContainer");
                let conflictList = document.getElementById("conflictList");
                conflictList.innerHTML = "";

                if (res.cek && res.cek.length > 0) {
                    conflictBox.classList.remove("hidden");
                    res.cek.forEach(c => {
                        conflictList.innerHTML += `• No ${c.no}. <b>${c.nama}</b>: ${c.masalah}<br>`;
                    });
                } else {
                    conflictBox.classList.add("hidden");
                }

                document.getElementById("previewSection").classList.remove("hidden");
            } catch (err) {
                showLoading(false);
                alert("Gagal membaca file Excel: " + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    async function saveUpload() {
        if (!appData.tempUploadPayload) return;
        let up = appData.tempUploadPayload;
        let action = document.getElementById("conflictAction").value;
        
        let s = await callBackend("simpanUpload", [up.kode, up.tgl, up.payload, action]);
        appData.activeKegiatan = await callBackend("getKegiatan", [s.keg]);
        
        document.getElementById("previewSection").classList.add("hidden");
        document.getElementById("homeSection").classList.add("hidden");
        document.getElementById("detailSection").classList.remove("hidden");
        renderDetailKegiatan();
    }

    function cancelUpload() {
        document.getElementById("previewSection").classList.add("hidden");
        appData.tempUploadPayload = null;
    }

    async function addManualParticipant() {
        let K = appData.activeKegiatan;
        let nama = document.getElementById("mNama").value.trim();
        let rm = document.getElementById("mRm").value.trim();
        let nik = document.getElementById("mNik").value.trim();
        let tgl = document.getElementById("mTgl").value;
        let jk = document.getElementById("mJk").value;

        if (!nama || !rm) {
            alert("Nama dan No RM wajib diisi!");
            return;
        }

        let newData = { nama: nama, rm: rm, nik: nik, tgl: tgl, jk: jk, status: "BELUM" };
        let resNew = await callBackend("tambahPeserta", [K.id, newData]);
        K.rows.push(resNew);
        
        document.getElementById("mNama").value = "";
        document.getElementById("mRm").value = "";
        document.getElementById("mNik").value = "";
        renderDetailKegiatan();
        alert(`${nama} berhasil ditambahkan!`);
    }

    function renderDetailKegiatan() {
        let K = appData.activeKegiatan;
        let isClosed = K.status === 'DITUTUP';
        document.getElementById("detailTitle").textContent = `${K.kode} · ${K.tgl} ${isClosed ? '(Ditutup)' : ''}`;
        
        document.getElementById("statTotal").textContent = K.rows.length;
        document.getElementById("statHadir").textContent = K.rows.filter(p => p.hadir).length;
        document.getElementById("statKumpul").textContent = K.rows.filter(p => p.kumpul).length;

        let actionContainer = document.getElementById("actionButtonsContainer");
        let closedInfo = document.getElementById("closedInfoSection");
        let conflictBox = document.getElementById("conflictBox");
        conflictBox.classList.add("hidden");

        if (isClosed) {
            actionContainer.classList.add("hidden");
            closedInfo.classList.remove("hidden");
            if (K.url) {
                document.getElementById("closedDriveLinks").innerHTML = `<a href="${K.url}" target="_blank" style="color:var(--green);">📂 Buka File Spreadsheet Drive</a>`;
            }
        } else {
            actionContainer.classList.remove("hidden");
            closedInfo.classList.add("hidden");
        }

        filterParticipants();
    }

    // EXPORT EXCEL 4 SHEET LENGKAP DENGAN STYLING (BORDER, ALIGNMENT, BLOK WARNA)
    function exportToExcel4Sheets() {
        let K = appData.activeKegiatan;
        if (!K || !K.rows) return;

        let wb = XLSX.utils.book_new();
        let kodePt = String(K.kode || "").toUpperCase();

        let headers = kodePt.includes("SMJ") 
            ? ['NO', 'NO RM', 'NAMA', 'JK', 'TANGGAL LAHIR', 'USIA', 'NO KTP', 'NO HP', 'JENIS MCU', 'TTD', 'HAID/HAMIL']
            : ['NO', 'NO RM', 'NAMA', 'NO. URUT MCU', 'BAGIAN', 'JABATAN', 'TEMPAT LAHIR', 'TANGGAL LAHIR', 'USIA', 'JENIS KELAMIN', 'NO HP', 'NO. KTP', 'TTD', 'HAID/HAMIL'];

        let thinBorder = {
            top: { style: "thin", color: { rgb: "000000" } },
            bottom: { style: "thin", color: { rgb: "000000" } },
            left: { style: "thin", color: { rgb: "000000" } },
            right: { style: "thin", color: { rgb: "000000" } }
        };

        // 1. Sheet: MCU KLINIK JEPARA (Tanpa Warna Baris, Standar)
        let rawData = [
            [kodePt.includes("SMJ") ? "DAFTAR HADIR MEDICAL CHECK UP PT SAMI JEPARA FACTORY" : "DAFTAR HADIR MEDICAL CHECK UP PT PARKLAND WORLD INDONESIA"],
            [`TANGGAL ${K.tgl}`],
            [],
            headers
        ];
        K.rows.forEach(p => {
            rawData.push([
                p.no, p.rm, p.nama, p.jk || "", p.tgl || "", p.usia || "", p.nik || "", p.hp || "", p.jenis || "", p.no, p.haid || ""
            ]);
        });
        let wsRaw = XLSX.utils.aoa_to_sheet(rawData);
        
        // Format styling untuk MCU KLINIK JEPARA
        for (let r = 3; r < rawData.length; r++) {
            for (let c = 0; c < headers.length; c++) {
                let cellRef = XLSX.utils.encode_cell({ r: r, c: c });
                if (!wsRaw[cellRef]) continue;
                let align = (c === 2) ? "left" : "center"; // Nama rata kiri, sisanya tengah
                wsRaw[cellRef].s = {
                    alignment: { horizontal: align, vertical: "center" },
                    border: thinBorder,
                    font: r === 3 ? { bold: true } : { bold: false }
                };
                if (r === 3) {
                    wsRaw[cellRef].fill = { fgColor: { rgb: "D9D9D9" } };
                }
            }
        }
        XLSX.utils.book_append_sheet(wb, wsRaw, "MCU KLINIK JEPARA");

        // Builder untuk sheet PENDAFTARAN, HADIR, TIDAK HADIR (Lengkap dengan Blok Warna Status)
        function createStyledSheet(sheetName, subsetRows, isPendaftaran = false) {
            let sData = [
                [kodePt.includes("SMJ") ? "DAFTAR HADIR MEDICAL CHECK UP PT SAMI JEPARA FACTORY" : "DAFTAR HADIR MEDICAL CHECK UP PT PARKLAND WORLD INDONESIA"],
                [`TANGGAL ${K.tgl}`],
                [],
                headers
            ];
            subsetRows.forEach(p => {
                sData.push([
                    p.no, p.rm, p.nama, p.jk || "", p.tgl || "", p.usia || "", p.nik || "", p.hp || "", p.jenis || "", p.no, p.haid || ""
                ]);
            });
            let ws = XLSX.utils.aoa_to_sheet(sData);

            for (let r = 3; r < sData.length; r++) {
                let pData = subsetRows[r - 4];
                let hexColor = "D9D9D9"; // Default header

                if (r > 3 && pData) {
                    if (isPendaftaran) {
                        if (pData.kumpul) hexColor = "92D050"; // Hijau
                        else if (pData.hadir) hexColor = "F4F207"; // Kuning
                        else hexColor = "FF0000"; // Merah
                    } else {
                        hexColor = (sheetName === "HADIR") ? "92D050" : "FF0000";
                    }
                }

                for (let c = 0; c < headers.length; c++) {
                    let cellRef = XLSX.utils.encode_cell({ r: r, c: c });
                    if (!ws[cellRef]) continue;
                    let align = (c === 2) ? "left" : "center";
                    
                    ws[cellRef].s = {
                        alignment: { horizontal: align, vertical: "center" },
                        border: thinBorder,
                        font: r === 3 ? { bold: true } : { bold: false }
                    };

                    if (r === 3) {
                        ws[cellRef].fill = { fgColor: { rgb: "D9D9D9" } };
                    } else {
                        ws[cellRef].fill = { fgColor: { rgb: hexColor } };
                    }
                }
            }
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
        }

        createStyledSheet("PENDAFTARAN", K.rows, true);
        createStyledSheet("HADIR", K.rows.filter(p => p.hadir), false);
        createStyledSheet("TIDAK HADIR", K.rows.filter(p => !p.hadir), false);

        let fileName = `MCU_${K.kode}_${K.tgl}.xlsx`;
        XLSX.writeFile(wb, fileName);
    }

    // LIVE SEARCH INSTAN DENGAN FULL BLOK WARNA BACKGROUND CARD
    function filterParticipants() {
        let K = appData.activeKegiatan;
        if (!K) return;
        let q = document.getElementById("searchBox").value.toUpperCase();
        let listDiv = document.getElementById("participantList");
        listDiv.innerHTML = "";

        K.rows.forEach(p => {
            let match = !q || p.no.toString() === q || p.nama.toUpperCase().includes(q) || p.rm.toUpperCase().includes(q) || (p.nik && p.nik.toString().includes(q));
            if (!match) return;

            let cardColorClass = "card-white";
            let statusIcon = "⚪";
            if (K.status === "DITUTUP" && !p.hadir) {
                cardColorClass = "card-red";
                statusIcon = "🔴";
            } else if (p.kumpul) {
                cardColorClass = "card-green";
                statusIcon = "🟢";
            } else if (p.hadir) {
                cardColorClass = "card-yellow";
                statusIcon = "🟡";
            }

            let item = document.createElement("div");
            item.className = `participant-item ${cardColorClass}`;
            item.innerHTML = `<span>${p.no}. ${statusIcon} ${p.nama}</span> <span>▼</span>`;
            item.onclick = () => {
                let box = item.nextElementSibling;
                box.classList.toggle("active");
            };

            let details = document.createElement("div");
            details.className = "details-box";
            
            let htmlDetails = `<b>RM:</b> ${p.rm} | <b>NIK:</b> ${p.nik || '-'}<br>` +
                              `<b>Tgl Lahir:</b> ${p.tgl} | <b>Usia:</b> ${p.usia || '-'}thn | <b>JK:</b> ${p.jk}<br>`;
            if (p.haid) htmlDetails += `<span style="color:var(--yellow);"><b>Ket:</b> ${p.haid}</span><br>`;
            
            if (K.status === "DRAFT") {
                if (!p.hadir) {
                    let isP = String(p.jk).toUpperCase().includes("P");
                    htmlDetails += `<hr style="border-color:#444; margin:5px 0;">`;
                    if (isP) {
                        htmlDetails += `<div class="radio-group">` +
                                       `<label><input type="radio" name="stat_${p.no}" value="" checked onclick="onRadioChange(${p.no}, '')"> Tidak ada</label>` +
                                       `<label><input type="radio" name="stat_${p.no}" value="HAID" onclick="onRadioChange(${p.no}, 'HAID')"> HAID</label>` +
                                       `<label><input type="radio" name="stat_${p.no}" value="HAMIL" onclick="onRadioChange(${p.no}, 'HAMIL')"> HAMIL</label>` +
                                       `</div>` +
                                       `<select id="haid_sel_${p.no}" style="display:none;" onchange="onSelectHaidChange(${p.no})">` +
                                       `<option value="1">Hari Ke-1</option><option value="2">Hari Ke-2</option><option value="3">Hari Ke-3</option>` +
                                       `<option value="4">Hari Ke-4</option><option value="5">Hari Ke-5</option><option value="6">Hari Ke-6</option><option value="7">Hari Ke-7</option><option value="Lainnya">Lainnya</option>` +
                                       `</select>` +
                                       `<input type="text" id="haid_txt_${p.no}" class="hidden" placeholder="Ketik hari keberapa...">`;
                    }
                    htmlDetails += `<button onclick="setHadir(${p.no})">✅ Set Hadir</button>`;
                } else if (p.hadir && !p.kumpul) {
                    htmlDetails += `<button onclick="setKumpul(${p.no})" style="background:var(--green); color:#000;">📁 Berkas Terkumpul</button>`;
                }
            }
            details.innerHTML = htmlDetails;

            listDiv.appendChild(item);
            listDiv.appendChild(details);
        });
    }

    function onRadioChange(no, val) {
        let sel = document.getElementById(`haid_sel_${no}`);
        let txt = document.getElementById(`haid_txt_${no}`);
        if (!sel) return;
        if (val === "HAID") {
            sel.style.display = "block";
            onSelectHaidChange(no);
        } else {
            sel.style.display = "none";
            if (txt) txt.classList.add("hidden");
        }
    }

    function onSelectHaidChange(no) {
        let sel = document.getElementById(`haid_sel_${no}`);
        let txt = document.getElementById(`haid_txt_${no}`);
        if (!sel || !txt) return;
        if (sel.value === "Lainnya") {
            txt.classList.remove("hidden");
        } else {
            txt.classList.add("hidden");
        }
    }

    async function setHadir(no) {
        let K = appData.activeKegiatan;
        let p = K.rows.find(x => x.no === no);
        let val = "";
        let isP = String(p.jk).toUpperCase().includes("P");
        if (isP) {
            let radios = document.getElementsByName(`stat_${no}`);
            let chosen = "";
            for (let r of radios) { if (r.checked) chosen = r.value; }
            if (chosen === "HAID") {
                let sel = document.getElementById(`haid_sel_${no}`).value;
                if (sel === "Lainnya") {
                    let customVal = document.getElementById(`haid_txt_${no}`).value.trim();
                    val = customVal ? `HAID+${customVal}` : "HAID";
                } else {
                    val = `HAID+${sel}`;
                }
            } else if (chosen === "HAMIL") {
                val = "HAMIL";
            }
        }
        let res = await callBackend("setHadir", [K.id, no, val]);
        Object.assign(p, res);
        renderDetailKegiatan();
    }

    async function setKumpul(no) {
        let K = appData.activeKegiatan;
        let p = K.rows.find(x => x.no === no);
        let res = await callBackend("setKumpul", [K.id, String(no)]);
        Object.assign(p, res);
        renderDetailKegiatan();
    }

    async function closeMcu() {
        let K = appData.activeKegiatan;
        let res = await callBackend("tutup", [K.id]);
        if (res && res.perlu) {
            document.getElementById("conflictText").textContent = `Ada ${res.jumlah} perbedaan data olahan dengan file pendaftaran awal.`;
            document.getElementById("conflictBox").classList.remove("hidden");
        } else {
            appData.activeKegiatan = res;
            renderDetailKegiatan();
            alert("MCU berhasil ditutup!");
        }
    }

    async function resolveClose(pilihan) {
        let K = appData.activeKegiatan;
        let res = await callBackend("tutup", [K.id, pilihan]);
        appData.activeKegiatan = res;
        renderDetailKegiatan();
    }

    async function openAgainMcu() {
        let K = appData.activeKegiatan;
        let res = await callBackend("bukaLagi", [K.id]);
        appData.activeKegiatan = res;
        renderDetailKegiatan();
        alert("MCU berhasil dibuka kembali!");
    }

    async function resetCurrentKegiatan() {
        if (!confirm("Yakin ingin menghapus data MCU ini?")) return;
        let K = appData.activeKegiatan;
        await callBackend("resetKegiatan", [K.id]);
        backToHome();
    }

    async function resetAllData() {
        if (!confirm("Yakin ingin mereset SELURUH data?"))Nun;
        await callBackend("resetSemua");
        handleLogin(true);
    }
</script>
</body>
</html>
